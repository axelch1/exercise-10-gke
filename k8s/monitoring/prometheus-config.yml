apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: exercise-10
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
      - job_name: "api"
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            action: keep
            regex: api
        metrics_path: /health
